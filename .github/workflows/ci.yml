name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy notsolazy
      - run: uv run pytest
      - run: uv run nsl doctor
      - run: uv run nsl init-db
      - run: uv run alembic upgrade head
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: web/out
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nsl_ci
          POSTGRES_USER: nsl_ci
          POSTGRES_PASSWORD: nsl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nsl_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nsl_ci:nsl_ci@localhost:5432/nsl_ci
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked --python 3.12
      - run: uv run nsl init-db
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
