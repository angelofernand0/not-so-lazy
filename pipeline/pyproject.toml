[project]
name = "notsolazy"
version = "0.1.0"
description = "A reproducible SEC annual-report language change pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "lxml>=5,<7",
  "edgartools>=5.62,<7",
  "rapidfuzz>=3.14,<4",
  "diff-match-patch>=20241021",
  "pysbd>=0.3.4,<0.4",
  "scipy>=1.15,<2",
  "sentence-transformers>=5,<6",
  "torch>=2.6,<3",
]

[project.scripts]
nsl = "notsolazy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-lxml>=2026.2.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Keep Linux CI and scheduled batch inference on CPU wheels rather than CUDA.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
