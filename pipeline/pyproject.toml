[project]
name = "notsolazy"
version = "0.1.0"
description = "A reproducible SEC annual-report language change pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3", "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
]

[project.scripts]
nsl = "notsolazy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
